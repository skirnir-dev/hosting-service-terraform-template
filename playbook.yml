---
- hosts: all
  become: true
  vars_files:
    - ./ansible/var_files.yml
    - ./ansible/key.yml
  tasks:
    - name: Disable SELinux
      tags: [bootstrap]
      ansible.posix.selinux: state=disabled

    - name: Update waagent.conf
      tags: [bootstrap]
      lineinfile:
        path: /etc/waagent.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^ResourceDisk\.Format=.*$', line: 'ResourceDisk.Format=y' }
        - { regexp: '^ResourceDisk\.Filesystem=.*$', line: 'ResourceDisk.Filesystem=ext4' }
        - { regexp: '^ResourceDisk\.MountPoint=.*$', line: 'ResourceDisk.MountPoint=/mnt/resource' }
        - { regexp: '^ResourceDisk\.EnableSwap=.*$', line: 'ResourceDisk.EnableSwap=y' }
        - { regexp: '^ResourceDisk\.SwapSizeMB=.*$', line: 'ResourceDisk.SwapSizeMB=3072' }

    - name: remove gpg keys
      tags: [bootstrap, packages]
      changed_when: false
      rpm_key:
        key: 'https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux'
        state: absent
    - name: import gpg keys
      tags: [bootstrap, packages]
      rpm_key:
        key: 'https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux'
        state: present

    - name: Install required packages
      tags: [packages]
      dnf:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - glibc-langpack-ja
          - git
          - make
          - patch
          - rsync
          - mariadb-server
          - mysql-devel
          - httpd
          - httpd-devel
          - mod_ssl
          - php
          - php-mbstring
          - php-devel
          - php-mhash
          - php-pgsql
          - php-mysqli
          - php-xml
          - php-gd
          - php-intl
          - php-curl
          - php-zip
          - php-opcache
          - php-pecl-apcu
          - php-pear
          - postgresql-server

    - name: Install EPEL repository
      tags: [packages]
      dnf:
        name: epel-release
        state: present

    - name: Install EPEL packages
      tags: [packages]
      dnf:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - libssh2
          - libssh2-devel
          - python3-mysqlclient

    - name: Install certbot
      tags: [packages, certbot]
      dnf:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - certbot
          - python3-certbot-apache

    - name: Install PHP module
      tags: [packages, php]
      dnf:
        name: '@php:7.4'
        state: present

    - name: Install PostgreSQL module
      tags: [packages, postgres]
      dnf:
        name: '@postgresql:12'
        state: present

    - name: Add gh-cli repository
      tags: [packages, gh]
      command: dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
      args:
        creates: "/etc/yum.repos.d/gh-cli.repo"

    - name: Install gh-cli
      tags: [packages, gh]
      dnf:
        name: gh
        enablerepo: gh-cli
        state: present

    - name: Set timezone
      tags: [bootstrap]
      timezone:
        name: Asia/Tokyo

    - name: pecl install ssh2
      tags: [php]
      shell: 'echo "autodetect" | pecl install channel://pecl.php.net/ssh2-1.3.1'
      args:
        creates: "/usr/lib64/php/modules/ssh2.so"

    - name: ssh2.ini
      tags: [php]
      copy:
        src: ./ansible/etc/php.d/40-ssh2.ini
        dest: /etc/php.d/40-ssh2.ini
        owner: root
        group: root

    - name: Enable and start MariaDB
      tags: [mariadb]
      systemd:
        name: mariadb.service
        enabled: yes
        state: started

    - name: Enable and start Apache
      tags: [httpd]
      systemd:
        name: httpd.service
        enabled: yes
        state: started

    - name: Enable and start PHP-FPM
      tags: [php]
      systemd:
        name: php-fpm.service
        enabled: yes
        state: started

    - name: Upgrade all packages
      tags: [packages, upgrade]
      dnf:
        name: "*"
        state: latest

    - name: initdb
      tags: [postgres]
      shell: "postgresql-setup --initdb"
      args:
        creates: "/var/lib/pgsql/data/PG_VERSION"

    - name: Update PostgreSQL settings
      tags: [postgres]
      replace:
        path: /var/lib/pgsql/data/pg_hba.conf
        regexp: '^host(\s+all)(.*)ident$'
        replace: 'host\1\2md5'

    - name: Enable and start PostgreSQL
      tags: [postgres]
      systemd:
        name: postgresql.service
        enabled: yes
        state: started

    # - name: Create user with password
    #   community.mysql.mysql_user:
    #     state: present
    #     name: eccube_db
    #     password: "{{ ec_db_password }}"
    #     host: "{{ item }}"
